# SPDX-License-Identifier: 0BSD
#
# The documentation site, built from the mirror and sent to rocinante-lang.org. A thin
# wrapper, like ci.yml: `odin run build -- docs` writes the site's source with tools/site
# (the reference's pictures drawn on Mesa's software Vulkan, as the golden images
# are) and builds it with the Hugo pinned in HUGO_VERSION; the finished files are then
# copied with rsync to the web server, over a key that can write nothing but the
# site's own folder. The key, the server's address and its host key are the secrets
# DEPLOY_SSH_KEY, DEPLOY_HOST and DEPLOY_KNOWN_HOSTS. Only pushes to main and manual
# runs reach it, never a pull request, so a fork cannot read them.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a newer push waits rather than cancelling one halfway.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev \
            libvulkan1 mesa-vulkan-drivers
      - name: Install Odin
        run: tools/ci/install-odin.sh "$HOME/odin"
      - name: Install Hugo
        run: tools/ci/install-hugo.sh "$HOME/hugo"
      - name: Find the latest SDL3 release
        id: sdl
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "tag=$(tools/ci/install-sdl3.sh --latest)" >> "$GITHUB_OUTPUT"
      - name: Restore SDL3
        uses: actions/cache@v6
        with:
          path: ~/sdl3
          key: sdl3-ubuntu-24.04-${{ steps.sdl.outputs.tag }}-${{ hashFiles('tools/ci/install-sdl3.sh') }}
      - name: Build SDL3
        run: tools/ci/install-sdl3.sh "$HOME/sdl3" "${{ steps.sdl.outputs.tag }}"
      - name: Build the site
        run: |
          export PATH="$HOME/odin:$HOME/hugo:$PATH"
          export LIBRARY_PATH="$HOME/sdl3/lib:${LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="$HOME/sdl3/lib:${LD_LIBRARY_PATH:-}"
          export PKG_CONFIG_PATH="$HOME/sdl3/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          # The pictures are drawn offscreen on lavapipe, as the golden images are.
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | tr '\n' ':')"
          export SDL_VIDEODRIVER=offscreen
          export HUGO_BASEURL="https://rocinante-lang.org/"
          odin run build -- docs
      - name: Send the site to rocinante-lang.org
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          # The server's key must be the one recorded in DEPLOY_KNOWN_HOSTS: no guessing.
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            output/site/public/ "deploy@${DEPLOY_HOST}:/"
