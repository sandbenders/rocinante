# SPDX-License-Identifier: 0BSD
#
# GitHub pipeline (CLAUDE.md section 11). A thin wrapper: every check lives in
# the build script's `ci` command. Runs the full pipeline on pushes to main and
# on version tags; there is no merge-request job on GitHub.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  full:
    runs-on: ubuntu-24.04 # pinned, like Odin; moved on purpose, not by GitHub
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        # clang for Odin, cmake and ninja to build SDL3, SDL3's video, audio and
        # input libraries, and Mesa's software Vulkan (lavapipe) for the golden
        # images (CLAUDE.md section 9).
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev \
            libvulkan1 mesa-vulkan-drivers
      - name: Install Odin
        run: tools/ci/install-odin.sh "$HOME/odin"
      # SDL3 has no package on Ubuntu 24.04, so the latest stable release is built
      # from source (decided 2026-10-27). The cache key holds the release's tag,
      # so a new release rebuilds and an unchanged one is restored in seconds.
      - name: Find the latest SDL3 release
        id: sdl
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "tag=$(tools/ci/install-sdl3.sh --latest)" >> "$GITHUB_OUTPUT"
      - name: Restore SDL3
        uses: actions/cache@v6
        with:
          path: ~/sdl3
          key: sdl3-ubuntu-24.04-${{ steps.sdl.outputs.tag }}-${{ hashFiles('tools/ci/install-sdl3.sh') }}
      - name: Build SDL3
        run: tools/ci/install-sdl3.sh "$HOME/sdl3" "${{ steps.sdl.outputs.tag }}"
      - name: Run the pipeline
        run: |
          export PATH="$HOME/odin:$PATH"
          export LIBRARY_PATH="$HOME/sdl3/lib:${LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="$HOME/sdl3/lib:${LD_LIBRARY_PATH:-}"
          export PKG_CONFIG_PATH="$HOME/sdl3/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "SDL3 $(pkg-config --modversion sdl3)"
          odin run build -- ci
