# The documentation site. Its reference, messages and coloured guides are written by
# `odin run tools/site`, which copies this folder to output/site first; build there.
baseURL = "https://rocinante-lang.org/"
locale = "en"
title = "rocinante"
disableKinds = ["taxonomy", "term", "rss"]
# For search engines: a sitemap of every page, and a robots.txt that names it.
enableRobotsTXT = true

[sitemap]
changeFreq = "weekly"

[markup.goldmark.renderer]
# The generated pages hold coloured code as HTML.
unsafe = true

[markup.tableOfContents]
# A guide lists its sections, and the parts of each, beside it.
startLevel = 2
endLevel = 3

[params]
# What a page without a summary of its own says it is, and what a link shared elsewhere shows.
description = "rocinante is a creative coding language and framework: a line makes a picture, mistakes come with a plain explanation, and the running sketch updates as you save."
image = "img/logo-sketch.png"
release = "alpha"
repository = "https://github.com/sandbenders/rocinante"
contact = "hello@rocinante-lang.org"
