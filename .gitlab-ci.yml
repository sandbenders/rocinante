# SPDX-License-Identifier: 0BSD
#
# GitLab pipeline (CLAUDE.md section 11). A thin wrapper: every check lives in
# the build script's `ci` command.
#
# Assumes the ORION runner uses the Docker executor and carries the tag `orion`;
# change `image` and `tags` here if it is set up differently. The image is built on
# ORION from tools/ci/orion.Dockerfile (the command is at its top): Arch with every
# package the pipeline needs already installed, and the pinned Odin in /opt/odin.

default:
  image: rocinante-ci:latest
  tags: [orion]

variables:
  ODIN_DIR: $CI_PROJECT_DIR/.cache/odin
  ROCI_REQUIRE_SDL3: "1" # the C ABI check must run here, not skip
  ROCI_REQUIRE_LAVAPIPE: "1" # and so must the golden images

.setup: &setup
  # The image's Odin when it is the release named in ODIN_VERSION; otherwise that
  # release is fetched, so a new pin never waits for the image to be rebuilt.
  - |
    if /opt/odin/odin version 2>/dev/null | grep -q "$(tr -d '[:space:]' < ODIN_VERSION)"; then
      export PATH="/opt/odin:$PATH"
    else
      tools/ci/install-odin.sh "$ODIN_DIR"
      export PATH="$ODIN_DIR:$PATH"
    fi

# Fast check on merge requests only.
fast:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - *setup
    - odin run build -- ci --fast

# Full pipeline on every commit to main.
full:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - *setup
    - odin run build -- ci

# Release on version tags: the full pipeline. The Linux release artefact joins
# this job when there is something to package.
release:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - *setup
    - odin run build -- ci
