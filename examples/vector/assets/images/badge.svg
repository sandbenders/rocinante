<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200">
  <title>A badge</title>
  <defs>
    <path id="ray" d="M100 18 L104 40 L96 40 Z"/>
    <style>
      .ring { fill: #f3e9c6; fill-rule: evenodd }
      .hill { fill: #1d2a2a }
      .wave { fill: none; stroke: #7fd1c7; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round }
    </style>
  </defs>
  <!-- the disc, and a ring cut out of it by a second contour going the other way -->
  <circle cx="100" cy="100" r="96" fill="#e7704b"/>
  <path class="ring" d="M100 6 A94 94 0 1 1 99.9 6 Z M100 14 A86 86 0 1 0 100.1 14 Z"/>
  <!-- the sun, with its rays turned about the middle -->
  <g fill="#ffd166" transform="translate(0 4)">
    <circle cx="100" cy="86" r="22"/>
    <g id="rays" stroke="none">
      <use href="#ray"/>
      <use href="#ray" transform="rotate(45 100 86)"/>
      <use href="#ray" transform="rotate(90 100 86)"/>
      <use href="#ray" transform="rotate(135 100 86)"/>
      <use href="#ray" transform="rotate(180 100 86)"/>
      <use href="#ray" transform="rotate(225 100 86)"/>
      <use href="#ray" transform="rotate(270 100 86)"/>
      <use href="#ray" transform="rotate(315 100 86)"/>
    </g>
  </g>
  <!-- hills, a curve and a wave -->
  <path class="hill" d="M14 140 C 40 110, 70 112, 96 138 S 150 150, 186 128 L186 150 A90 90 0 0 1 14 150 Z"/>
  <path class="wave" d="M34 158 q 10 -12 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0"/>
  <rect x="86" y="110" width="28" height="22" rx="4" fill="#c1440e" stroke="#f3e9c6" stroke-width="2"/>
  <polygon points="86,110 100,96 114,110" fill="#8c2f0b" stroke="#f3e9c6" stroke-width="2" stroke-linejoin="round"/>
</svg>
